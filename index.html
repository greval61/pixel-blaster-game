<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pixel Blaster</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Menu Screen -->
    <div id="menu-screen" class="overlay">
      <h1 class="title">PIXEL BLASTER</h1>
      <button id="btn-start" class="btn-primary">START GAME</button>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <span class="hud-label">SCORE</span>
        <span id="score-display" class="hud-value">0</span>
      </div>
      <div class="hud-center">
        <span class="hud-label">WAVE</span>
        <span id="wave-display" class="hud-value">1</span>
      </div>
      <div class="hud-right">
        <span class="hud-label">LIVES</span>
        <div id="lives-display" class="lives-icons"></div>
      </div>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="overlay hidden">
      <h2 class="title-small">PAUSED</h2>
      <button id="btn-resume" class="btn-primary">RESUME</button>
      <button id="btn-restart" class="btn-secondary">RESTART</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
      <h2 class="title-small">GAME OVER</h2>
      <p id="final-score" class="final-score">Puntuación: 0</p>
      <button id="btn-play-again" class="btn-primary">PLAY AGAIN</button>
    </div>

    <!-- Pause and Fire Buttons for Mobile -->
    <button id="btn-pause-mobile" class="btn-mobile hidden" aria-label="Pause">⏸</button>
    <button id="btn-fire-mobile" class="btn-mobile hidden" aria-label="Fire">🔥</button>

  </div>

  <!-- Cargar scripts directamente -->
  <script src="src/utils.js"></script>
  <script src="src/input.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/particleSystem.js"></script>
  <script src="src/player.js"></script>
  <script src="src/enemy.js"></script>
  <script src="src/waveManager.js"></script>
  <script src="src/game.js"></script>
  <script type="module" src="main.js?cb=1"></script>

</body>
</html>
